<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Ujian TKA - Simulasi TKA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d4656;
        }
    </style>
</head>
<body class="min-h-screen text-white flex justify-center items-start sm:items-center p-0 sm:p-4">

    <!-- Mobile Frame / Wrapper Centered for Desktop Preview -->
    <div class="w-full max-w-md min-h-screen sm:min-h-0 sm:rounded-[36px] bg-[#0d4656] p-6 shadow-2xl flex flex-col justify-between overflow-hidden">
        
        <div>
            <!-- Header Section -->
            <div class="flex items-start justify-between mt-2 mb-8">
                <div>
                    <h1 class="text-3xl font-extrabold text-white tracking-tight">Jelajahi Simulasi TKA Mapil Animasi</h1>
                    <p class="text-emerald-100/70 text-sm mt-1 font-normal">Pilih paket simulasi Anda di bawah ini</p>
                </div>
                <!-- Orange Badge Header Icon -->
                <div class="w-10 h-10 bg-orange-500 rounded-2xl flex items-center justify-center shadow-lg shadow-orange-500/30 text-white hover:scale-105 transition-transform cursor-pointer">
                    <i class="fa-solid fa-rocket text-lg"></i>
                </div>
            </div>

            <!-- Cards Container -->
            <div class="space-y-6">

                <!-- CARD 1: Simulasi TKA 01 -->
                <a href="https://siraga.github.io/simple_widget-01/tka_animasi_01.html" class="block group transform transition-all duration-300 hover:-translate-y-1">
                    <div class="rounded-2xl overflow-hidden shadow-lg border border-teal-500/20">
                        <!-- Top Image Area (Cyan Blue Background) -->
                        <div class="bg-[#199bb0] group-hover:bg-[#1bb2ca] transition-colors h-40 flex flex-col items-center justify-center text-white relative">
                            <i class="fa-solid fa-book-open text-6xl mb-2 text-white/90"></i>
                            <span class="text-sm font-medium tracking-wide text-white/90">Paket Dasar</span>
                            
                            <!-- Floating Badge Icon -->
                            <div class="absolute top-3 right-3 bg-white/20 backdrop-blur-sm p-2 rounded-xl text-white">
                                <i class="fa-solid fa-file-signature text-sm"></i>
                            </div>
                        </div>
                        <!-- Bottom Label Area (Light Grey/White Background) -->
                        <div class="bg-[#e7eaee] py-4 px-6 text-gray-900 flex justify-between items-center">
                            <div>
                                <h2 class="text-lg font-bold tracking-tight text-gray-800">Simulasi TKA 01</h2>
                                <p class="text-xs text-gray-500 font-medium">Level Beginner</p>
                            </div>
                            <i class="fa-solid fa-chevron-right text-gray-400 group-hover:text-teal-600 group-hover:translate-x-1 transition-all"></i>
                        </div>
                    </div>
                </a>

                <!-- CARD 2: Simulasi TKA 02 -->
                <a href="https://siraga.github.io/simple_widget-01/tka_animasi_02.html" class="block group transform transition-all duration-300 hover:-translate-y-1">
                    <div class="rounded-2xl overflow-hidden shadow-lg border border-teal-500/20">
                        <!-- Top Image Area (Cyan Blue Background) -->
                        <div class="bg-[#199bb0] group-hover:bg-[#1bb2ca] transition-colors h-40 flex flex-col items-center justify-center text-white relative">
                            <i class="fa-solid fa-book-open text-6xl mb-2 text-white/90"></i>
                            <span class="text-sm font-medium tracking-wide text-white/90">Paket Menengah</span>
                            
                            <!-- Floating Badge Icon -->
                            <div class="absolute top-3 right-3 bg-white/20 backdrop-blur-sm p-2 rounded-xl text-white">
                                <i class="fa-solid fa-brain text-sm"></i>
                            </div>
                        </div>
                        <!-- Bottom Label Area (Light Grey/White Background) -->
                        <div class="bg-[#e7eaee] py-4 px-6 text-gray-900 flex justify-between items-center">
                            <div>
                                <h2 class="text-lg font-bold tracking-tight text-gray-800">Simulasi TKA 02</h2>
                                <p class="text-xs text-gray-500 font-medium">Level Intermediate</p>
                            </div>
                            <i class="fa-solid fa-chevron-right text-gray-400 group-hover:text-teal-600 group-hover:translate-x-1 transition-all"></i>
                        </div>
                    </div>
                </a>

                <!-- CARD 3: Simulasi TKA 03 -->
                <a href="https://siraga.github.io/simple_widget-01/tka_animasi_03.html" class="block group transform transition-all duration-300 hover:-translate-y-1">
                    <div class="rounded-2xl overflow-hidden shadow-lg border border-teal-500/20">
                        <!-- Top Image Area (Cyan Blue Background) -->
                        <div class="bg-[#199bb0] group-hover:bg-[#1bb2ca] transition-colors h-40 flex flex-col items-center justify-center text-white relative">
                            <i class="fa-solid fa-book-open text-6xl mb-2 text-white/90"></i>
                            <span class="text-sm font-medium tracking-wide text-white/90">Paket Mahir</span>
                            
                            <!-- Floating Badge Icon -->
                            <div class="absolute top-3 right-3 bg-white/20 backdrop-blur-sm p-2 rounded-xl text-white">
                                <i class="fa-solid fa-trophy text-sm"></i>
                            </div>
                        </div>
                        <!-- Bottom Label Area (Light Grey/White Background) -->
                        <div class="bg-[#e7eaee] py-4 px-6 text-gray-900 flex justify-between items-center">
                            <div>
                                <h2 class="text-lg font-bold tracking-tight text-gray-800">Simulasi TKA 03</h2>
                                <p class="text-xs text-gray-500 font-medium">Level Expert</p>
                            </div>
                            <i class="fa-solid fa-chevron-right text-gray-400 group-hover:text-teal-600 group-hover:translate-x-1 transition-all"></i>
                        </div>
                    </div>
                </a>

            </div>
        </div>

        <!-- Footer / Status Info -->
        <div class="mt-8 pt-4 pb-2 border-t border-teal-800/60 flex items-center justify-center gap-2 text-xs text-emerald-200/80 font-medium">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
            Sistem Siap. Selamat Berjuang!
        </div>

    </div>

</body>
</html>
